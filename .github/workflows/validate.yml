name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python -m unittest discover -s tools -t .
      - run: uv run python tools/validate.py
  coraza-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/coraza
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/coraza/go.mod
      - run: go test ./...
  libmodsecurity-adapter:
    runs-on: ubuntu-latest
    needs: lean
    env:
      MSC_VERSION: v3.0.17
      MSC_PREFIX: /home/runner/modsecurity
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libxml2-dev libyajl-dev
      - uses: actions/cache@v4
        id: msc
        with:
          path: /home/runner/modsecurity
          key: libmodsecurity-${{ env.MSC_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.msc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y automake libtool pkg-config g++ make
          git clone --depth 1 -b "$MSC_VERSION" --recurse-submodules --shallow-submodules https://github.com/owasp-modsecurity/ModSecurity.git /tmp/msc
          cd /tmp/msc && ./build.sh
          ./configure --prefix="$MSC_PREFIX" --disable-doxygen-doc --disable-examples \
            --without-lua --without-lmdb --without-ssdeep --without-curl --without-geoip --without-maxmind
          make -j"$(nproc)" && make install
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python -m unittest discover -s adapters/libmodsecurity -v
        env:
          MODSECURITY_LIB: /home/runner/modsecurity/lib/libmodsecurity.so
      - uses: actions/download-artifact@v4
        with:
          name: differential
          path: differential
      - run: uv run python adapters/libmodsecurity/differential.py differential/differential.json --out differential/v3.json
        env:
          MODSECURITY_LIB: /home/runner/modsecurity/lib/libmodsecurity.so
      - run: chmod +x differential/build/bin/seclang-eval && differential/build/bin/seclang-eval differential/v3.json
      - run: uv run python adapters/libmodsecurity/differential.py differential/crs-diff.json --out differential/crs-v3.json
        env:
          MODSECURITY_LIB: /home/runner/modsecurity/lib/libmodsecurity.so
      - run: differential/build/bin/seclang-eval differential/crs-v3.json
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          lake-package-directory: formal
          auto-config: "false"
          build: "true"
      - run: lake exe seclang-check
        working-directory: formal
      - run: lake exe seclang-check ../tests/unit/operators
        working-directory: formal
      - run: uv run python tools/engine_rules.py > formal/.lake/engine-rules.json
      - run: lake exe seclang-parse .lake/engine-rules.json
        working-directory: formal
      - run: lake exe seclang-eval .lake/engine-rules.json
        working-directory: formal
      - uses: actions/checkout@v4
        with:
          repository: coreruleset/coreruleset
          ref: v4.25.2
          path: crs
      - run: uv run python tools/crs_rules.py crs > formal/.lake/crs.json
      - run: lake exe seclang-parse .lake/crs.json
        working-directory: formal
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run ./cmd/differential -n 30 -seed 1 > ../../formal/.lake/differential.json
        working-directory: adapters/coraza
      - run: lake exe seclang-eval .lake/differential.json
        working-directory: formal
      - run: uv run python tools/crs_profile.py crs > formal/.lake/crs-profile.yaml
      - run: go run ./cmd/differential -profile ../../formal/.lake/crs-profile.yaml -n 20 -seed 1 > ../../formal/.lake/crs-diff.json
        working-directory: adapters/coraza
      - run: lake exe seclang-eval .lake/crs-diff.json
        working-directory: formal
      - run: uv run python tools/formal_results.py --crs crs --differential formal/.lake/differential.json --crs-differential formal/.lake/crs-diff.json --check
      - uses: actions/upload-artifact@v4
        with:
          name: differential
          path: |
            formal/.lake/differential.json
            formal/.lake/crs-diff.json
            formal/.lake/build/bin/seclang-eval
