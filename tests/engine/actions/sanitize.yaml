meta:
  name: sanitize
  description: sanitize* actions keep marked values out of the error and audit logs and write the fixed mask in the audit log
spec: 08-actions.md#sanitizearg
requires:
  - 08-actions.md#sanitizearg
  - 08-actions.md#sanitizematched
  - 08-actions.md#sanitizematchedbytes
  - 08-actions.md#sanitizerequestheader
  - 08-actions.md#sanitizeresponseheader
rules: |
  SecRuleEngine On
  SecRequestBodyAccess On
  SecResponseBodyAccess On
  SecRule ARGS_GET:a "@streq 1" "id:6330,phase:1,pass,log,msg:'sanitize arg %{ARGS.pw}',sanitizeArg:PW"
  SecRule ARGS:card "@rx ^4[0-9]+$" "id:6331,phase:2,pass,log,msg:'card %{MATCHED_VAR}',sanitizeMatched"
  SecRule ARGS:note "@rx s[0-9]cr[0-9]tw[0-9]rd" "id:6332,phase:2,pass,log,msg:'note %{MATCHED_VAR}',sanitizeMatchedBytes"
  SecRule REQUEST_HEADERS:X-Token "@rx ." "id:6333,phase:1,pass,log,msg:'token %{REQUEST_HEADERS.x-token}',sanitizeRequestHeader:x-token"
  SecRule RESPONSE_HEADERS:X-Session "@rx ." "id:6334,phase:3,pass,log,msg:'session %{RESPONSE_HEADERS.x-session}',sanitiseResponseHeader:X-Session"
tests:
  - test_title: sanitizeArg masks a query-string argument, name compared case-insensitively
    spec: 08-actions.md#sanitizearg
    stages:
      - stage:
          input: {uri: '/?a=1&pw=hunter2pass'}
          output:
            triggered_rules: [6330]
            no_log_contains: hunter2pass
            no_audit_log_contains: hunter2pass
            audit_log_contains: '[sanitized]'
  - test_title: sanitizeMatched masks a URL-encoded body argument
    spec: 08-actions.md#sanitizematched
    stages:
      - stage:
          input:
            method: POST
            headers: {Content-Type: application/x-www-form-urlencoded}
            data: card=4111111111111111&x=y
          output:
            triggered_rules: [6331]
            no_log_contains: '4111111111111111'
            no_audit_log_contains: '4111111111111111'
            audit_log_contains: '[sanitized]'
  - test_title: sanitizeMatchedBytes masks only the matched bytes
    spec: 08-actions.md#sanitizematchedbytes
    stages:
      - stage:
          input: {uri: '/?note=keep-s3cr3tw0rd-tail'}
          output:
            triggered_rules: [6332]
            no_log_contains: s3cr3tw0rd
            no_audit_log_contains: s3cr3tw0rd
            audit_log_contains: 'keep-[sanitized]-tail'
  - test_title: sanitizeRequestHeader masks a request header
    spec: 08-actions.md#sanitizerequestheader
    stages:
      - stage:
          input:
            headers: {X-Token: tok-abcdef123456}
          output:
            triggered_rules: [6333]
            no_log_contains: tok-abcdef123456
            no_audit_log_contains: tok-abcdef123456
            audit_log_contains: '[sanitized]'
  - test_title: sanitiseResponseHeader (alias) masks a response header
    spec: 08-actions.md#sanitizeresponseheader
    stages:
      - stage:
          input: {uri: /}
          response:
            headers: {X-Session: sess-9876543210}
          output:
            triggered_rules: [6334]
            no_log_contains: sess-9876543210
            no_audit_log_contains: sess-9876543210
            audit_log_contains: '[sanitized]'
